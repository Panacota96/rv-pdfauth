name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: clippy (findings also surfaced as annotations)
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log; then
            grep -E "^(src|fuzz|tests)/.*(error|warning)" clippy.log | head -40 | while IFS= read -r l; do echo "::error title=clippy::${l}"; done
            exit 1
          fi
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python helpers (independent verifiers + local test TSA/PKI for the trust tests)
        run: pip install blake3 jsonschema pyhanko
      - name: PDFium (pinned + SHA-256 verified; the visual-diff tests must run, not skip)
        if: runner.os == 'Linux'
        run: |
          bash scripts/fetch_pdfium.sh linux-x64
          echo "RV_PDFIUM_PATH=$PWD/third_party/pdfium/linux-x64/libpdfium.so" >> "$GITHUB_ENV"
      - name: PDFium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\fetch_pdfium.ps1 -Platform win-x64
          "RV_PDFIUM_PATH=$PWD\third_party\pdfium\win-x64\pdfium.dll" >> $env:GITHUB_ENV
      - name: Unit and integration tests (includes docs/usage-cli.md drift check and trust tests)
        shell: bash
        env:
          RV_TEST_PYTHON: python
        run: |
          set -o pipefail
          # Failures are also surfaced as annotations (readable through the API without downloading logs).
          if ! cargo test --workspace --locked 2>&1 | tee test.log; then
            grep -E "panicked at|^---- |FAILED|^failures:|assertion|Error:|error:" test.log | head -40 | while IFS= read -r l; do echo "::error title=cargo test::${l}"; done
            exit 1
          fi
      - name: Self-test of the hash implementations
        run: cargo run --locked -q -p rv-pdfauth-cli -- self-test
      - name: Sample run
        shell: bash
        run: |
          # The sample set contains high-severity findings by design: exit code 3 is the expected result.
          rc=0
          cargo run --locked -q -p rv-pdfauth-cli -- analyze -i examples/sample/evidence --hash sha256,blake3 --lang all --out ci-out --progress none --no-timestamp || rc=$?
          test "$rc" -eq 3
      - name: Cross-language verification (Python re-checks the chain, hashes and JSON schemas)
        shell: bash
        run: |
          run=$(find ci-out/logs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)
          python tests/verify_chain.py "ci-out/logs/$run"
          python tests/validate_reports.py "ci-out/reports/$run"
      - name: Real TSA smoke test (DigiCert; network-dependent, informative)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          cargo run --locked -q -p rv-pdfauth-cli -- analyze -i examples/sample/evidence --out tsa-out --progress none > tsa.txt || test $? -eq 3
          cat tsa.txt
          grep -q "timestamp: ok" tsa.txt
          run=$(find tsa-out/logs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)
          cargo run --locked -q -p rv-pdfauth-cli -- verify-log "tsa-out/logs/$run"
      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked -p rv-pdfauth-cli -p rv-pdfauth-gui
          # PDFium is loaded from next to the executable.
          Copy-Item third_party\pdfium\win-x64\pdfium.dll target\release\
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: rv-pdfauth-windows-x64-${{ github.sha }}
          path: |
            target/release/rv-pdfauth.exe
            target/release/rv-pdfauth-gui.exe
            target/release/pdfium.dll
            third_party/pdfium/win-x64/licenses/
            third_party/pdfium/win-x64/LICENSE-pdfium-binaries.txt
          retention-days: 14
