[package]
name = "rv-pdfauth-core"
description = "RV PDFAuth core: evidence intake, dual hashing, audit chain, analysis and reports"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
name = "rv_pdfauth_core"
path = "src/lib.rs"

[dependencies]
md-5.workspace = true
sha1.workspace = true
sha2.workspace = true
sha3.workspace = true
blake3.workspace = true
digest.workspace = true
serde.workspace = true
serde_json.workspace = true
minijinja.workspace = true
chrono.workspace = true
walkdir.workspace = true
ureq.workspace = true
p12-keystore.workspace = true
cms.workspace = true
x509-tsp.workspace = true
x509-cert.workspace = true
der.workspace = true
spki.workspace = true
const-oid.workspace = true
rsa.workspace = true
sha2-legacy.workspace = true
rv-pdfauth-pdf.workspace = true
rv-pdfauth-render.workspace = true
memmap2.workspace = true
flate2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[features]
# Use rv_pdfauth_pdf::starter_db() (bundled fingerprint DB) once the PDF layer provides it.
# Off: an empty "starter" DB is recorded as unavailable (see src/fingerprints.rs).
starter-db = []

[dev-dependencies]
tempfile.workspace = true
