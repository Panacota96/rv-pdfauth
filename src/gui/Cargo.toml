[package]
name = "rv-pdfauth-gui"
description = "RV PDFAuth desktop interface (Windows 10/11, also builds on Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true
# egui/eframe/epaint 0.37 declare rust-version 1.95 (the rest of the workspace needs 1.88).
rust-version = "1.95"
authors.workspace = true

[[bin]]
name = "rv-pdfauth-gui"
path = "src/main.rs"

[lib]
name = "rv_pdfauth_gui"
path = "src/lib.rs"

[dependencies]
rv-pdfauth-core.workspace = true
eframe.workspace = true
serde_json.workspace = true
# Revision viewer: decode the diff PNGs written by the core; dates on the timeline.
png.workspace = true
chrono.workspace = true

# Native file/folder pickers on Windows (no GTK/portal dependency elsewhere: a text field is used instead).
[target.'cfg(windows)'.dependencies]
rfd.workspace = true
